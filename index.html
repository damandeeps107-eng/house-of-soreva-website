<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>500 Internal Server Error</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #ededed; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
    h1 { font-size: 24px; font-weight: 500; border-right: 1px solid rgba(255,255,255,0.3); padding-right: 20px; display: inline-block; margin: 0; }
    p { display: inline-block; margin: 0 0 0 20px; font-size: 14px; color: #888; }
  </style>
</head>
<body>
  <div>
    <h1>500</h1>
    <p>Application error: a server-side exception has occurred (see browser console for more information).</p>
  </div>
</body>
</html>
